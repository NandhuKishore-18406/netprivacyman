[project]
name = "netrack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NandhuKishore-18406", email = "nandhukishore18406@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "adblockparser>=0.7",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scapy>=2.7.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "selenium>=4.49.0",
    "tabulate>=0.10.0",
    "torch>=2.14.1",
    "webdriver-manager>=4.1.2",
]

[project.scripts]
netrack = "netrack:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
